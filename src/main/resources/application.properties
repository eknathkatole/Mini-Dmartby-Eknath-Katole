spring.application.name=dmart-api

# ─── Database ────────────────────────────────────────────────────────────────
# Values are read from environment variables (see .env.example).
# The fallback values after the colon are for local development ONLY.
# Production deployments MUST set the environment variables — never hardcode credentials.
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-cool-wind-ax5a7vqc-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:changeme}

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8081}

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Secret must be a 64-character hex string (256-bit key for HMAC-SHA256).
# Generate with: openssl rand -hex 32
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token validity in milliseconds — default 24 hours
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ─── CORS ────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ─── Return/Exchange Policy ──────────────────────────────────────────────────
app.return.window-days=${RETURN_WINDOW_DAYS:7}
