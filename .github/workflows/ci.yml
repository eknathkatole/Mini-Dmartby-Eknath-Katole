name: Mini D-Mart CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── 1. Backend Build & Test ──────────────────────────────────────────────
  backend-ci:
    name: Build & Test Java Backend (Spring Boot 3.3 / Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests=false

      - name: Verify Docker Container Build
        run: docker build -t demart-api:latest .

  # ─── 2. Frontend Build Verification ──────────────────────────────────────
  frontend-ci:
    name: Build React Frontend (Vite 6 / Tailwind CSS v4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./demart-ui

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './demart-ui/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Production Build
        run: npm run build

  # ─── 3. Continuous Deployment Status ────────────────────────────────────
  deploy:
    name: Trigger Render Continuous Deployment
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deployment Notification
        run: |
          echo "All Full-Stack CI Checks Passed! Render is automatically deploying main branch."
